<footer class="site-footer" *ngIf="content$ | async as c">
  <div class="container footer-grid">
    <div class="footer-col">
      <h4 class="footer-title">EdilSolido Costruzioni</h4>
      <p>Impresa edile dal 1995. Qualità, esperienza e professionalità al servizio dei tuoi progetti.</p>
      <p>P. IVA: IT01234567890</p>
    </div>
    <div class="footer-col">
      <h4 class="footer-title">Link Rapidi</h4>
      <ul class="footer-links">
        <li><a routerLink="/">Home</a></li>
        <li><a routerLink="/gallery">Galleria Lavori</a></li>
        <li><a routerLink="/quote">Preventivatore</a></li>
        <li><a routerLink="/contacts">Contatti</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4 class="footer-title">Contatti</h4>
      <ul class="footer-contact">
        <li>📞 <a [href]="'tel:'+c.phone">{{ c.phone }}</a></li>
        <li>✉️ <a [href]="'mailto:'+c.email">{{ c.email }}</a></li>
        <li>📍 Milano - Via Roma 10</li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">
    <div class="container">
      <p [innerHTML]="c.footerCopyright"></p>
    </div>
  </div>
</footer>
